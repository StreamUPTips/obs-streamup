Plugins.IntroBlurb="StreamUP 把多个不同的功能集成在一个插件里。选择你需要的，其余保持关闭。任何被你关闭的功能都不会运行、不会加载界面、不会绑定快捷键、不会监听事件。不占用任何资源。"
Plugins.Toolbar.Title="StreamUP 工具栏"
Plugins.Toolbar.Description="可以固定在 OBS 任意一侧的工具栏。可放入直播、录制、重播缓存、虚拟摄像头、工作室模式、场景或任意自定义操作的按钮。在 设置 > 工具栏 > 配置工具栏 中进行配置。即时生效。"
Plugins.MultiDock.Title="MultiDock 系统"
Plugins.MultiDock.Description="容器式 Dock，可把多个 OBS 或 StreamUP 的 Dock 合并到一个带标签页的面板中。当界面布局已经排满时非常有用。在 工具 > StreamUP > MultiDock 中管理。即时生效。"
Plugins.SceneOrganiser.Title="场景管理器"
Plugins.SceneOrganiser.Description="用带文件夹、自定义排序和工作室模式感知切换的场景列表替换 OBS 自带的场景列表。为主画布提供一个 Dock，也为竖屏或次级画布提供一个。禁用需要重启 OBS，因为 OBS 不允许插件在运行时移除已注册的 Dock。"
Plugins.StreamupDock.Title="StreamUP Dock"
