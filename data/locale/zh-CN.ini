AdjustmentLayer.Tooltip.GroupOnly="当调整图层位于分组内时，此项控制它是只影响该分组内的来源，还是影响场景上的所有来源。\n\n启用：只影响同一分组内的来源\n禁用：影响场景上所有符合条件的来源"
AdjustmentLayer.Tooltip.HideOriginals="从场景中隐藏原始（未经滤镜处理的）来源，只保留调整图层的滤镜输出可见。\n\n适合制作干净的合成画面，避免原始来源在下方露出。"
AdjustmentLayer.Tooltip.FilterMode="控制哪些来源可以被此调整图层影响。\n\n所有来源：影响该图层下方的所有来源\n仅包含列表：只影响你添加到列表中的来源\n排除列表：影响除列表之外的所有来源"
AdjustmentLayer.Tooltip.SourcePicker="从下拉菜单中选择一个来源，将其添加到滤镜列表。"
AdjustmentLayer.Tooltip.FilterSources="当前位于包含或排除列表中的来源。点击 X 按钮可移除某个来源。"
AdjustmentLayer.Tooltip.AutoSnapZ="每一帧都将调整图层吸附到最低的包含来源上方一层。\n\n若不启用，铺满画布的包含来源会把滤镜结果绘制在场景中的所有内容之上，遮住“未包含”的来源。启用后，滤镜输出会在包含来源的层级渲染，其上方的项目仍然可见。\n\n配合“隐藏原始来源”效果最佳。若想手动放置调整图层，请关闭此项。"

