Settings.Theme.StudioMode="Studio Mode"
Settings.Theme.StudioModeDesc="Marks the halfway point on the transition slider and gives the program view a bar along the bottom to match the preview, so the two line up. The program bar goes after restarting OBS."
Settings.Theme.Spacing="Dock and window spacing"
Settings.Theme.SpacingDesc="Keeps docks off the window edge so their rounded corners show, and removes the extra padding inside OBS's own docks."
Settings.Theme.WindowPolish="Window polish"
Settings.Theme.WindowPolishDesc="Shows colour previews in properties as rounded pills, and gives the Remux, Import and Missing Files lists taller rows. Windows already open keep their look until reopened."
